<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#e8f5e9" id="metaTheme">
<meta name="description" content="袁子寒 · 郑州大学生物技术专业 · 生物医药相关技术岗位 / 科研助理 · 个人简历">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>袁子寒 · 个人简历</title>

<script>
(function(){try{var t=localStorage.getItem('r-theme');if(t!=='dark'&&t!=='light'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>

<style>
/* ============================================================
   设计令牌 —— 可爱温馨 / 移动端优先
   ============================================================ */
:root{
  --bg:#e8f5e9;
  --surface:#ffffff;
  --surface-2:#f1f8e9;
  --surface-3:#fafdf5;
  --text:#4e342e;
  --muted:#8d6e63;
  --muted-2:#a1887f;
  --border:#d7ccc8;
  --border-dashed:#bcaaa4;

  --primary:#795548;
  --primary-hover:#5d4037;
  --primary-soft:#efebe9;
  --accent:#f06292;
  --accent-soft:#fce4ec;
  --yellow:#ffd54f;
  --yellow-soft:#fff8e1;
  --purple:#ab47bc;
  --purple-soft:#f3e5f5;
  --school:#1a5e5a;
  --school-soft:#e0f2f1;

  --nav-bg:#5d4037;
  --nav-text:#efebe9;
  --nav-active:#ffd54f;

  --shadow-sm:0 2px 0 rgba(121,85,72,.08);
  --shadow:0 4px 0 rgba(121,85,72,.09), 0 10px 22px -12px rgba(121,85,72,.22);
  --shadow-hover:0 6px 0 rgba(121,85,72,.10), 0 16px 30px -12px rgba(121,85,72,.30);
  --r:22px;
  --r-sm:14px;
  --r-pill:999px;
  --dock-h:64px;

  --tbd-bg:#fff3e0;
  --tbd-fg:#e65100;
  --tbd-bd:#ffcc80;
  --track:#efebe9;

  --pad:16px;
}

[data-theme="dark"]{
  --bg:#1a1513;
  --surface:#2a2220;
  --surface-2:#332a26;
  --surface-3:#221c1a;
  --text:#f0e9e4;
  --muted:#bcaaa4;
  --muted-2:#a1887f;
  --border:#4e342e;
  --border-dashed:#5d4037;

  --primary:#a1887f;
  --primary-hover:#bcaaa4;
  --primary-soft:#3e2723;
  --accent:#f48fb1;
  --accent-soft:#4a2c3a;
  --yellow:#ffe082;
  --yellow-soft:#3e3320;
  --purple:#ce93d8;
  --purple-soft:#3e2a42;
  --school:#4db6ac;
  --school-soft:#1e3a37;

  --nav-bg:#2c1f1b;
  --nav-text:#efebe9;
  --nav-active:#ffe082;

  --shadow-sm:0 2px 0 rgba(0,0,0,.35);
  --shadow:0 4px 0 rgba(0,0,0,.35), 0 10px 22px -12px rgba(0,0,0,.65);
  --shadow-hover:0 6px 0 rgba(0,0,0,.4), 0 16px 30px -12px rgba(0,0,0,.75);

  --tbd-bg:#4e342e;
  --tbd-fg:#ffcc80;
  --tbd-bd:#8d6e63;
  --track:#4e342e;
}

/* ============================================================
   基础重置
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
  scroll-behavior:smooth;scroll-padding-top:96px;
  height:100%;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.7;color:var(--text);background-color:var(--bg);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
  min-height:100%;
  padding-bottom:calc(var(--dock-h) + env(safe-area-inset-bottom,0px) + 8px);
  overscroll-behavior-y:none;
}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px dashed var(--primary);outline-offset:3px;border-radius:8px}

a,button,.tab,.chip,[role="tab"]{touch-action:manipulation}

.wrap{width:100%;max-width:680px;margin:0 auto;padding:0 var(--pad)}

/* ============================================================
   ✨ 粒子画布背景
   ============================================================ */
#particles{
  position:fixed;inset:0;z-index:0;
  pointer-events:none;
  opacity:.85;
  transition:opacity .6s ease;
}
[data-theme="dark"] #particles{opacity:.55}

/* ============================================================
   漂浮 emoji 装饰层
   ============================================================ */
.floaters{
  position:fixed;inset:0;pointer-events:none;z-index:1;
  overflow:hidden;
}
.floater{
  position:absolute;font-size:18px;opacity:.4;
  animation:float 6s ease-in-out infinite;
  will-change:transform;
  user-select:none;
}
.floater:nth-child(1){top:14%;left:5%;animation-delay:0s;font-size:22px}
.floater:nth-child(2){top:26%;right:6%;animation-delay:.8s;font-size:16px}
.floater:nth-child(3){top:52%;left:4%;animation-delay:1.6s;font-size:20px}
.floater:nth-child(4){top:68%;right:7%;animation-delay:2.4s;font-size:18px}
.floater:nth-child(5){top:84%;left:7%;animation-delay:3.2s;font-size:16px}

@keyframes float{
  0%,100%{transform:translateY(0) rotate(-6deg)}
  50%{transform:translateY(-16px) rotate(8deg)}
}

main,.nav,.footer,.dock{position:relative;z-index:2}

/* ============================================================
   顶部导航
   ============================================================ */
.nav{
  position:sticky;top:0;z-index:50;
  background:var(--nav-bg);
  box-shadow:0 3px 0 rgba(0,0,0,.12);
  padding-top:env(safe-area-inset-top,0px);
}
.nav-inner{
  max-width:680px;margin:0 auto;height:52px;
  padding:0 12px;display:flex;align-items:center;gap:8px;
}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;color:var(--nav-text);letter-spacing:.01em}
.brand-dot{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;
  background:var(--yellow);
  display:grid;place-items:center;color:var(--nav-bg);font-size:13px;font-weight:800;
  box-shadow:0 2px 0 rgba(0,0,0,.15);
  animation:wobble 4s ease-in-out infinite;
  transform-origin:50% 80%;
}
@keyframes wobble{
  0%,100%{transform:rotate(-8deg)}
  50%{transform:rotate(8deg)}
}
.nav-links{display:none}
.nav-actions{display:flex;gap:6px;margin-left:auto}

.icon-btn{
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.12);color:var(--nav-text);
  transition:transform .15s ease,background .15s ease;
}
.icon-btn:active{transform:scale(.88);background:rgba(255,255,255,.25)}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.nav-chips{
  display:flex;gap:6px;padding:0 12px 9px;
  overflow-x:auto;overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  scroll-snap-type:x proximity;
}
.nav-chips::-webkit-scrollbar{display:none}
.nav-chips a{
  flex:0 0 auto;padding:6px 14px;border-radius:var(--r-pill);
  font-size:12.5px;font-weight:700;color:var(--nav-text);
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);
  white-space:nowrap;transition:all .18s ease;
  scroll-snap-align:start;
}
.nav-chips a.active{
  color:var(--nav-bg);background:var(--nav-active);border-color:var(--nav-active);
  box-shadow:0 2px 0 rgba(0,0,0,.12);
}

/* ============================================================
   Hero
   ============================================================ */
.hero{padding:18px 0 4px}
.hero-card{
  background:var(--surface);border:2px dashed var(--border-dashed);
  border-radius:var(--r);padding:22px 18px;
  box-shadow:var(--shadow);
  position:relative;overflow:hidden;
  animation:heroIn .7s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes heroIn{
  from{opacity:0;transform:translateY(20px) scale(.97)}
  to{opacity:1;transform:none}
}
.hero-card::before{
  content:"";position:absolute;top:-24px;right:-24px;width:90px;height:90px;
  background:var(--yellow-soft);border-radius:50%;z-index:0;opacity:.7;
  animation:float 7s ease-in-out infinite;
}
.hero-card::after{
  content:"";position:absolute;bottom:-34px;left:-24px;width:110px;height:110px;
  background:var(--accent-soft);border-radius:50%;z-index:0;opacity:.55;
  animation:float 8s ease-in-out infinite reverse;
}
.hero-card>*{position:relative;z-index:1}

.hero-deco{
  position:absolute;pointer-events:none;z-index:1;font-size:20px;
  animation:float 5s ease-in-out infinite;
}
.hero-deco.d1{top:12px;right:20px;animation-delay:.2s}
.hero-deco.d2{top:56px;left:12px;animation-delay:1.4s;font-size:15px}
.hero-deco.d3{bottom:20px;right:16px;animation-delay:2.6s;font-size:17px}

.status{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:700;color:var(--primary);
  background:var(--yellow-soft);border:1px dashed var(--yellow);
  padding:5px 12px 5px 9px;border-radius:var(--r-pill);line-height:1.4;
  margin-bottom:14px;
  animation:slideDown .6s cubic-bezier(.2,.8,.3,1) .1s both;
}
@keyframes slideDown{
  from{opacity:0;transform:translateY(-8px)}
  to{opacity:1;transform:none}
}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,98,146,.5)}70%{box-shadow:0 0 0 8px rgba(240,98,146,0)}100%{box-shadow:0 0 0 0 rgba(240,98,146,0)}}

.hero-top{display:flex;align-items:center;gap:14px}
.hero-avatar-wrap{flex-shrink:0}
.hero-avatar{
  width:88px;height:88px;border-radius:50%;
  border:3px dashed var(--accent);
  padding:4px;background:var(--surface-2);
  position:relative;
  animation:avatarFloat 4s ease-in-out infinite;
}
@keyframes avatarFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}
.hero-avatar img{
  width:100%;height:100%;border-radius:50%;object-fit:cover;
  background:var(--primary-soft);
}
.hero-avatar::after{
  content:"✨";position:absolute;bottom:-4px;right:-4px;font-size:16px;
  animation:spinStar 3s ease-in-out infinite;
}
@keyframes spinStar{
  0%,100%{transform:rotate(0) scale(1)}
  50%{transform:rotate(20deg) scale(1.15)}
}
.hero-text{min-width:0;flex:1}
.hero-name{
  font-size:26px;font-weight:900;letter-spacing:-.02em;line-height:1.2;
  color:var(--text);
  animation:slideDown .6s cubic-bezier(.2,.8,.3,1) .2s both;
}
.hero-name span{
  background:linear-gradient(135deg,var(--accent),var(--purple),var(--accent));
  background-size:200% 200%;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:gradientMove 5s ease infinite;
  display:inline-block;
}
@keyframes gradientMove{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
.hero-role{margin-top:3px;font-size:12.5px;font-weight:700;color:var(--primary);line-height:1.5}
.hero-sum{margin-top:12px;font-size:13.8px;line-height:1.8;color:var(--muted);text-align:left}

.hero-stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:14px;
  border-top:1px dashed var(--border);
}
.stat{text-align:center;padding:6px 2px;border-radius:var(--r-sm);transition:background .2s ease}
.stat:active{background:var(--surface-2)}
.stat .num{
  font-size:20px;font-weight:900;color:var(--primary);line-height:1.2;
  font-variant-numeric:tabular-nums;
  display:inline-block;
}
.stat .label{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px;line-height:1.3}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chip{
  font-size:11.5px;line-height:1.5;padding:5px 12px;border-radius:var(--r-pill);
  background:var(--yellow-soft);color:var(--primary);
  border:1px dashed var(--yellow);white-space:nowrap;font-weight:700;
  transition:transform .15s ease,background .15s ease;
}
.chip:active{transform:scale(.94);background:var(--yellow)}
.chips.sm .chip{font-size:11px;padding:3px 9px;background:var(--surface-2);border-color:var(--border-dashed);color:var(--muted)}
.chips.sm .chip:active{background:var(--primary-soft);color:var(--primary)}

.hero-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}

/* ============================================================
   按钮
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:48px;padding:10px 14px;border-radius:var(--r-pill);
  border:2px solid var(--border);background:var(--surface);
  font-size:13.5px;font-weight:800;color:var(--text);
  box-shadow:var(--shadow-sm);
  position:relative;overflow:hidden;
  transition:transform .12s ease,box-shadow .15s ease,background .15s ease;
  -webkit-user-select:none;user-select:none;
}
.btn::after{
  content:"";position:absolute;top:0;bottom:0;left:-120%;width:60%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);
  transform:skewX(-18deg);
  animation:shine 3.6s ease-in-out infinite;
  pointer-events:none;
}
@keyframes shine{
  0%{left:-120%}
  55%,100%{left:130%}
}
.btn svg{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:active{transform:translateY(2px) scale(.98);box-shadow:none}
.btn.primary{
  background:var(--primary);color:#fff;border-color:var(--primary);
  box-shadow:0 3px 0 var(--primary-hover);
}
.btn.primary:active{box-shadow:none;transform:translateY(3px)}
.btn.accent{
  background:var(--accent);color:#fff;border-color:var(--accent);
  box-shadow:0 3px 0 #c2185b;
}
.btn.accent:active{box-shadow:none;transform:translateY(3px)}
.btn.outline{
  background:transparent;border:2px dashed var(--primary);color:var(--primary);
  box-shadow:none;
}
.btn.ok{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}

/* ============================================================
   区块
   ============================================================ */
.block{padding:24px 0;scroll-margin-top:96px}
.sec-head{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.sec-idx{
  font-size:10.5px;font-weight:900;letter-spacing:.08em;
  color:var(--primary);background:var(--yellow-soft);
  padding:4px 9px;border-radius:var(--r-pill);flex-shrink:0;
  border:1px dashed var(--yellow);
}
.sec-head h2{font-size:17px;font-weight:900;letter-spacing:-.01em;flex-shrink:0;color:var(--text)}
.sec-head .line{
  flex:1;height:2px;border-radius:2px;
  background:repeating-linear-gradient(90deg,var(--border-dashed) 0 6px,transparent 6px 12px);
  background-size:12px 100%;
  animation:dashMove 8s linear infinite;
}
@keyframes dashMove{
  from{background-position:0 0}
  to{background-position:24px 0}
}

.card{
  background:var(--surface);border:2px solid var(--border);
  border-radius:var(--r);box-shadow:var(--shadow-sm);
  contain:layout style;
}

/* ============================================================
   亮点
   ============================================================ */
.hl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.hl{
  position:relative;padding:14px 10px;border-radius:var(--r-sm);
  background:var(--surface);border:2px dashed var(--border-dashed);
  overflow:hidden;contain:layout style;
  transition:transform .2s cubic-bezier(.2,.8,.3,1),box-shadow .2s ease,border-color .2s ease;
  text-align:center;
}
.hl::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%, var(--yellow-soft), transparent 65%);
  opacity:0;transition:opacity .3s ease;pointer-events:none;
}
.hl:active::before{opacity:.9}
.hl:active{transform:scale(.96);box-shadow:var(--shadow-hover);border-color:var(--accent)}
.hl .icon{
  font-size:22px;margin-bottom:4px;display:inline-block;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);
}
.hl:active .icon{transform:scale(1.2) rotate(-10deg)}
.hl .m{
  font-size:19px;font-weight:900;line-height:1.2;letter-spacing:-.02em;
  color:var(--primary);position:relative;z-index:1;
}
.hl .m .tbd{font-size:11px;color:var(--tbd-fg);background:var(--tbd-bg);border:1px dashed var(--tbd-bd);padding:0 5px;border-radius:5px}
.hl .l{font-size:12px;font-weight:800;margin-top:3px;line-height:1.4;color:var(--text);position:relative;z-index:1}
.hl .d{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.55;position:relative;z-index:1}

.hl:nth-child(5){grid-column:1 / -1}

/* ============================================================
   Tabs
   ============================================================ */
.tabs{
  display:flex;gap:6px;padding:5px;margin-bottom:14px;
  background:var(--surface-2);border:2px dashed var(--border-dashed);border-radius:var(--r-pill);
  overflow-x:auto;overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:1 0 auto;min-height:44px;padding:10px 16px;border-radius:var(--r-pill);
  color:var(--muted);font-size:13.5px;font-weight:800;white-space:nowrap;
  transition:all .22s cubic-bezier(.2,.8,.3,1);
}
.tab[aria-selected="true"]{
  background:var(--primary);color:#fff;
  box-shadow:0 3px 0 var(--primary-hover);
}

/* ============================================================
   经历条目
   ============================================================ */
.exp-item{
  position:relative;padding:16px 14px 16px 18px;border-radius:var(--r);
  background:var(--surface);border:2px solid var(--border);
  box-shadow:var(--shadow-sm);margin-bottom:12px;
  contain:layout style;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
  animation:itemIn .5s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes itemIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:none}
}
.exp-item:nth-child(1){animation-delay:.05s}
.exp-item:nth-child(2){animation-delay:.12s}
.exp-item:nth-child(3){animation-delay:.19s}
.exp-item:last-child{margin-bottom:0}
.exp-item::before{
  content:"";position:absolute;left:-2px;top:16px;bottom:16px;width:5px;
  border-radius:0 5px 5px 0;
  background:var(--accent);
  transition:width .2s ease;
}
.exp-item:active{
  transform:scale(.985);
  box-shadow:var(--shadow-hover);
  border-color:var(--accent);
}
.exp-item:active::before{width:8px}
.exp-top{display:flex;flex-direction:column;gap:5px}
.exp-role{font-size:15.5px;font-weight:800;letter-spacing:-.01em;line-height:1.4;color:var(--text)}
.exp-org{font-size:12.5px;font-weight:700;color:var(--accent);line-height:1.5}
.exp-time{
  align-self:flex-start;font-size:11px;font-weight:700;color:var(--muted);
  background:var(--surface-2);border:1px dashed var(--border-dashed);
  padding:3px 10px;border-radius:var(--r-pill);line-height:1.5;
}

ul.bullets{list-style:none;margin-top:11px;display:grid;gap:7px}
ul.bullets li{
  position:relative;padding-left:16px;
  font-size:13.2px;line-height:1.75;color:var(--muted);
}
ul.bullets li::before{
  content:"🌸";position:absolute;left:0;top:.2em;font-size:9px;
}

/* ============================================================
   项目
   ============================================================ */
.proj-grid{display:grid;gap:12px}
.proj{
  padding:16px;border-radius:var(--r);contain:layout style;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
  border:2px dashed var(--border-dashed);
}
.proj:active{
  transform:scale(.985);
  box-shadow:var(--shadow-hover);
  border-color:var(--purple);
  border-style:solid;
}
.proj-head{display:flex;flex-direction:column;gap:5px}
.proj-head h3{font-size:15px;font-weight:800;letter-spacing:-.01em;line-height:1.45;color:var(--text)}
.proj-org{font-size:12.5px;font-weight:700;color:var(--accent);margin-top:1px;line-height:1.5}

/* ============================================================
   技能
   ============================================================ */
.skill-groups{display:grid;gap:12px}
.skill-card{padding:16px;border-radius:var(--r);contain:layout style;border:2px solid var(--border)}
.card-title,.skill-card h3{
  display:flex;align-items:center;gap:7px;
  font-size:13.5px;font-weight:800;margin-bottom:12px;color:var(--text);
}
.card-title::before,.skill-card h3::before{
  content:"🎀";font-size:14px;flex-shrink:0;
}
.bar-row{margin-bottom:12px}
.bar-row:last-child{margin-bottom:0}
.bar-top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-bottom:5px;line-height:1.5;font-weight:700}
.bar-top .pct{color:var(--muted);font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;flex-shrink:0}
.bar{height:9px;border-radius:var(--r-pill);background:var(--track);overflow:hidden;border:1px solid var(--border);position:relative}
.bar>i{
  display:block;height:100%;width:0;border-radius:var(--r-pill);
  background:repeating-linear-gradient(45deg,var(--accent) 0 8px,var(--purple) 8px 16px);
  background-size:200% 100%;
  transition:width 1.1s cubic-bezier(.2,.8,.3,1);
  animation:barStripes 2s linear infinite;
}
@keyframes barStripes{
  from{background-position:0 0}
  to{background-position:23px 0}
}

/* ============================================================
   教育 & 证书
   ============================================================ */
.edu-grid{display:grid;gap:12px}
.edu-card{padding:16px;border-radius:var(--r);contain:layout style;border:2px dashed var(--border-dashed)}

.edu-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.edu-badge{
  width:52px;height:52px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--school),#2a9d8f);
  color:#fff;
  display:grid;place-items:center;
  font-size:22px;font-weight:900;letter-spacing:.02em;
  box-shadow:0 4px 0 rgba(26,94,90,.28);
  position:relative;overflow:hidden;
}
.edu-badge::after{
  content:"🎓";position:absolute;bottom:-2px;right:-2px;font-size:16px;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.2));
}
.edu-head-text{min-width:0;flex:1}
.edu-school{font-size:16.5px;font-weight:900;letter-spacing:-.01em;line-height:1.3;color:var(--text)}
.edu-school-en{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-top:2px;text-transform:uppercase}
.edu-major{font-size:13px;font-weight:700;color:var(--accent);margin-top:3px;line-height:1.5}
.edu-time{font-size:11.5px;color:var(--muted);margin-top:4px;font-weight:700}

.edu-tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.edu-tag{
  font-size:11px;font-weight:800;line-height:1.5;
  padding:4px 10px;border-radius:var(--r-pill);
  background:var(--school-soft);color:var(--school);
  border:1px solid rgba(26,94,90,.18);
  white-space:nowrap;
}
[data-theme="dark"] .edu-tag{border-color:rgba(77,182,172,.28)}

.edu-intro{
  position:relative;
  font-size:12.6px;line-height:1.75;color:var(--muted);
  padding:10px 12px 10px 14px;
  border-radius:var(--r-sm);
  background:var(--surface-2);
  border-left:3px solid var(--school);
  margin-bottom:12px;
}
.edu-intro strong{color:var(--school);font-weight:800}

.edu-rows{list-style:none;display:grid;gap:10px}
.edu-rows li{display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:1.7}
.edu-rows .k{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.edu-rows .v{color:var(--text)}

.cert-list{list-style:none;display:grid;gap:10px}
.cert-list li{
  position:relative;padding-left:18px;font-size:13px;line-height:1.7;color:var(--muted);
}
.cert-list li::before{
  content:"⭐";position:absolute;left:0;top:0;font-size:11px;
}

/* ============================================================
   🖼 个人风采（生活照 + 驾照）
   ============================================================ */
.gallery-block{display:grid;gap:16px}
.gallery-section{
  padding:16px;border-radius:var(--r);
  background:var(--surface);border:2px dashed var(--border-dashed);
  box-shadow:var(--shadow-sm);
}
.gallery-subtitle{
  display:flex;align-items:center;gap:8px;
  font-size:13.5px;font-weight:800;color:var(--text);
  margin-bottom:12px;
}
.gallery-subtitle::before{
  content:"📸";font-size:15px;flex-shrink:0;
}
.gallery-section.license .gallery-subtitle::before{content:"📄"}

.gallery-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
}

.gallery-item{
  position:relative;display:block;
  aspect-ratio:1 / 1;
  border-radius:var(--r-sm);overflow:hidden;
  background:linear-gradient(135deg,var(--surface-2),var(--primary-soft));
  border:2px solid var(--border);
  cursor:pointer;
  transition:transform .25s cubic-bezier(.2,.8,.3,1),box-shadow .25s ease,border-color .25s ease;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.gallery-item::after{
  content:"🔍";position:absolute;top:6px;right:6px;
  width:26px;height:26px;border-radius:50%;
  background:rgba(255,255,255,.85);color:var(--primary);
  display:grid;place-items:center;font-size:12px;
  opacity:0;transform:scale(.8);
  transition:opacity .2s ease,transform .2s ease;
  pointer-events:none;
}
.gallery-item:hover::after,
.gallery-item:active::after{opacity:1;transform:scale(1)}
.gallery-item:active{transform:scale(.97)}
.gallery-item img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .35s ease;
  display:block;
}
.gallery-item:hover img{transform:scale(1.05)}
.gallery-item .cap{
  position:absolute;left:0;right:0;bottom:0;
  padding:16px 10px 8px;
  font-size:11px;font-weight:700;color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.62));
  text-shadow:0 1px 2px rgba(0,0,0,.4);
  pointer-events:none;
}

/* 驾照卡片 —— 横向比例 */
.license-wrap{
  display:flex;justify-content:center;
}
.license-item{
  width:100%;max-width:420px;
  aspect-ratio:85.6 / 54;
  border-radius:var(--r-sm);overflow:hidden;
  background:linear-gradient(135deg,var(--surface-2),var(--primary-soft));
  border:2px solid var(--border);
  cursor:pointer;position:relative;
  transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;
}
.license-item::after{
  content:"🔍";position:absolute;top:8px;right:8px;
  width:28px;height:28px;border-radius:50%;
  background:rgba(255,255,255,.9);color:var(--primary);
  display:grid;place-items:center;font-size:13px;
  opacity:0;transform:scale(.8);
  transition:opacity .2s ease,transform .2s ease;
}
.license-item:hover::after,
.license-item:active::after{opacity:1;transform:scale(1)}
.license-item:active{transform:scale(.98)}
.license-item img{
  width:100%;height:100%;object-fit:cover;display:block;
}

.photo-hint{
  font-size:11px;color:var(--muted);font-weight:700;
  margin-top:10px;text-align:center;line-height:1.5;
}

/* 图片加载失败的占位 */
img.img-fail{
  background:
    repeating-linear-gradient(45deg,var(--surface-2) 0 8px,var(--primary-soft) 8px 16px);
  object-fit:contain;
  padding:22%;
  opacity:.9;
}

/* ============================================================
   🔍 Lightbox
   ============================================================ */
.lightbox{
  position:fixed;inset:0;z-index:999;
  display:none;align-items:center;justify-content:center;
  padding:20px;
  background:rgba(20,12,8,.92);
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  opacity:0;
  transition:opacity .25s ease;
}
.lightbox.show{display:flex;opacity:1}
.lightbox img{
  max-width:100%;max-height:80vh;
  border-radius:var(--r-sm);
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  transform:scale(.94);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
.lightbox.show img{transform:scale(1)}
.lightbox-cap{
  position:absolute;left:0;right:0;bottom:24px;
  text-align:center;color:#f5efe8;
  font-size:13px;font-weight:700;letter-spacing:.02em;
  padding:0 20px;
}
.lightbox-close{
  position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;
  width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.15);color:#fff;
  transition:transform .15s ease,background .15s ease;
}
.lightbox-close:active{transform:scale(.9);background:rgba(255,255,255,.28)}
.lightbox-close svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ============================================================
   待补充
   ============================================================ */
.tbd{
  display:inline-block;font-size:11px;line-height:1.5;padding:0 6px;
  border-radius:5px;margin:0 1px;white-space:nowrap;
  background:var(--tbd-bg);color:var(--tbd-fg);border:1px dashed var(--tbd-bd);
  font-weight:700;
}

/* ============================================================
   页脚
   ============================================================ */
.footer{
  margin-top:20px;padding:22px 0 24px;
  border-top:3px dashed var(--border-dashed);
}
.footer-inner{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--muted);text-align:center;font-weight:700}
.footer-inner .heart{color:var(--accent);display:inline-block;animation:heartbeat 1.6s ease-in-out infinite}
@keyframes heartbeat{
  0%,100%{transform:scale(1)}
  15%{transform:scale(1.25)}
  30%{transform:scale(1)}
  45%{transform:scale(1.18)}
  60%{transform:scale(1)}
}

/* ============================================================
   移动端底部操作坞
   ============================================================ */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));
  background:var(--surface);
  border-top:2px dashed var(--border-dashed);
  box-shadow:0 -4px 16px rgba(0,0,0,.07);
}
.dock .btn{
  flex-direction:column;gap:3px;
  min-height:48px;padding:6px 4px;
  font-size:11px;font-weight:800;
  border-radius:var(--r-sm);
  box-shadow:none;border-width:2px;
}
.dock .btn svg{width:18px;height:18px}
.dock .btn::after{display:none}
.dock .btn:active{transform:scale(.94);background:var(--surface-2)}

.to-top{
  position:fixed;right:12px;z-index:59;
  bottom:calc(var(--dock-h) + env(safe-area-inset-bottom,0px) + 12px);
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:var(--yellow);color:var(--primary);border:2px solid var(--border);
  box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transform:translateY(10px) scale(.9);
  transition:opacity .25s ease,transform .25s cubic-bezier(.34,1.56,.64,1);
}
.to-top.show{opacity:1;pointer-events:auto;transform:none;animation:toTopBounce 2.4s ease-in-out infinite}
@keyframes toTopBounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-4px)}
}
.to-top svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* ============================================================
   进场动画
   ============================================================ */
.reveal{opacity:0;transform:translateY(14px);transition:opacity .55s cubic-bezier(.2,.8,.3,1),transform .55s cubic-bezier(.2,.8,.3,1)}
.reveal.in{opacity:1;transform:none}

/* ============================================================
   平板 / 桌面增强
   ============================================================ */
@media (min-width:600px){
  :root{--pad:20px}
  .hl-grid{grid-template-columns:repeat(3,1fr)}
  .hl:nth-child(5){grid-column:auto}
  .proj-grid{grid-template-columns:repeat(2,1fr)}
  .edu-grid{grid-template-columns:repeat(2,1fr)}
  .skill-groups{grid-template-columns:repeat(2,1fr)}
  .hero-actions{grid-template-columns:repeat(4,auto);justify-content:start}
  .exp-top{flex-direction:row;justify-content:space-between;align-items:flex-start;gap:12px}
  .exp-time{align-self:auto}
  .edu-rows li{flex-direction:row;gap:12px;align-items:baseline}
  .edu-rows .k{flex:0 0 76px}
  .footer-inner{flex-direction:row;justify-content:space-between;text-align:left}
  .hero-avatar{width:104px;height:104px;border-width:4px}
  .hero-name{font-size:32px}
  .hero-role{font-size:14px}
  .gallery-grid{grid-template-columns:repeat(3,1fr);gap:12px}
}

@media (min-width:768px){
  html{scroll-padding-top:70px}
  body{font-size:15.5px;padding-bottom:0}
  .wrap{max-width:920px}
  .nav-inner{height:60px;padding:0 24px;gap:12px}
  .nav-links{display:flex;gap:4px;margin-left:auto}
  .nav-links a{
    padding:9px 16px;border-radius:var(--r-pill);font-size:13.5px;font-weight:700;
    color:var(--nav-text);transition:all .18s ease;
  }
  .nav-links a.active,.nav-links a:hover{
    background:var(--nav-active);color:var(--nav-bg);
    box-shadow:0 2px 0 rgba(0,0,0,.1);
  }
  .nav-actions{margin-left:10px}
  .nav-chips{display:none}
  .icon-btn{width:40px;height:40px}
  .block{padding:36px 0}
  .sec-head h2{font-size:20px}
  .hl-grid{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  .hl{padding:20px 14px}
  .hl .m{font-size:24px}
  .hl .l{font-size:13px}
  .exp-item{padding:20px 20px 20px 24px}
  .exp-item::before{top:20px;bottom:20px;width:6px}
  .exp-role{font-size:17px}
  .proj{padding:20px}
  .skill-card,.edu-card{padding:20px}
  .hero{padding:36px 0 18px}
  .hero-card{padding:32px 28px}
  .hero-avatar{width:120px;height:120px;border-width:4px}
  .hero-name{font-size:38px}
  .hero-role{font-size:15px}
  .hero-sum{font-size:14.5px;max-width:62ch}
  .btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:var(--primary)}
  .btn.primary:hover{background:var(--primary-hover)}
  .btn.accent:hover{background:#e91e63}
  .hl:hover,.exp-item:hover,.proj:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--primary)}
  .hl:hover::before{opacity:.9}
  .hl:hover .icon{transform:scale(1.15) rotate(-8deg)}
  .dock{display:none}
  .to-top{bottom:24px;right:24px}
  .floater{font-size:24px;opacity:.5}
  .chips{justify-content:flex-start}
  .edu-intro{font-size:13.2px}
  .gallery-grid{grid-template-columns:repeat(5,1fr)}
}

@media (min-width:1080px){
  .wrap{max-width:1040px}
}

/* ============================================================
   降低动效
   ============================================================ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
  .reveal{opacity:1;transform:none}
  .bar>i{width:100%!important}
  .floater{display:none}
  #particles{display:none}
}

/* ============================================================
   打印 / 导出 PDF
   ============================================================ */
@media print{
  @page{margin:12mm 10mm}
  html,body{
    background:#fff!important;color:#111!important;
    font-size:10.5pt;line-height:1.55;padding-bottom:0!important;
  }
  .nav,.dock,.to-top,.hero-actions,.no-print,.floaters,#particles,.lightbox{display:none!important}
  .wrap{max-width:100%;padding:0}
  .hero{padding:0 0 8px}
  .hero-card{border:1px solid #ccc;box-shadow:none;padding:12px;animation:none}
  .hero-card::before,.hero-card::after,.hero-deco{display:none}
  .hero-name{font-size:24pt;color:#5d4037}
  .hero-name span{-webkit-text-fill-color:#5d4037;color:#5d4037}
  .hero-role{font-size:11pt}
  .hero-sum{font-size:9.8pt;max-width:none;color:#333}
  .hero-avatar{width:90px;height:90px;animation:none}
  .status{border-color:#ccc;color:#795548;background:#fff8e1}

  .card,.hl,.exp-item,.proj,.skill-card,.edu-card,.gallery-section{
    box-shadow:none!important;background:#fff!important;border:1px solid #dcdcdc!important;
    break-inside:avoid;page-break-inside:avoid;animation:none!important;
  }
  .exp-item::before{background:#5d4037!important;width:4px!important}
  .hl .m{color:#795548!important}
  .hl .m .tbd{color:#e65100!important}
  .chip{background:#f5f5f5;color:#5d4037;border-color:#ddd}
  ul.bullets li,.cert-list li{color:#333}
  ul.bullets li::before{content:"•";color:#795548;font-size:14px;top:-.1em}
  .bar>i{background:#795548!important;width:100%!important;animation:none}
  .bar-top .pct{color:#666}

  .edu-badge{box-shadow:none;background:#1a5e5a!important;color:#fff!important}
  .edu-tag{background:#e0f2f1!important;color:#1a5e5a!important;border-color:#b2dfdb!important}
  .edu-intro{background:#f7fafc!important;border-left-color:#1a5e5a!important;color:#333}

  /* 打印时展示图片，两列紧凑 */
  .gallery-block{gap:8px}
  .gallery-section{padding:8px}
  .gallery-grid{grid-template-columns:repeat(3,1fr)!important;gap:6px!important}
  .gallery-item{aspect-ratio:1/1!important}
  .gallery-item::after,.license-item::after{display:none!important}
  .gallery-item .cap{font-size:9pt;padding:10px 6px 4px}
  .license-item{max-width:300px;aspect-ratio:85.6/54}
  .photo-hint{display:none}

  .tabs{display:none!important}
  .tab-panel,.is-hidden{display:block!important}
  .tab-panel::before{
    content:attr(data-label);display:block;
    font-size:11pt;font-weight:800;color:#5d4037;margin:10px 0 6px;
  }
  .tab-panel:first-child::before{margin-top:2px}

  .block{padding:9px 0;break-inside:avoid}
  .hl-grid,.proj-grid,.skill-groups,.edu-grid{
    display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important;
  }
  .hl:nth-child(5){grid-column:auto}
  .sec-head{margin-bottom:7px}
  .sec-head h2{font-size:12.5pt}
  .sec-idx{background:#fff8e1;color:#795548}
  .footer{margin-top:8px;padding:8px 0 0;color:#666;border-top:1px solid #ccc}
  .footer-inner{flex-direction:row;justify-content:space-between}
  .footer-inner .heart{animation:none}
}
</style>
</head>

<body>

<!-- ✨ 粒子画布 -->
<canvas id="particles" aria-hidden="true"></canvas>

<!-- ✨ 漂浮 emoji -->
<div class="floaters" aria-hidden="true">
  <span class="floater">💖</span>
  <span class="floater">⭐</span>
  <span class="floater">🎵</span>
  <span class="floater">🌸</span>
  <span class="floater">🎀</span>
</div>

<!-- ============================================================
     顶部导航
     ============================================================ -->
<header class="nav" id="top">
  <div class="nav-inner">
    <a class="brand" href="#top" aria-label="返回顶部">
      <span class="brand-dot" aria-hidden="true">袁</span>
      <span>袁子寒</span>
    </a>

    <nav class="nav-links" id="navLinks" aria-label="主导航">
      <a href="#highlights">亮点</a>
      <a href="#experience">经历</a>
      <a href="#projects">项目</a>
      <a href="#skills">技能</a>
      <a href="#education">教育</a>
      <a href="#gallery">风采</a>
    </nav>

    <div class="nav-actions">
      <button class="icon-btn" id="themeBtn" type="button" aria-label="切换深色 / 浅色模式">
        <svg id="themeIcon" viewBox="0 0 24 24" aria-hidden="true"></svg>
      </button>
      <button class="icon-btn" id="printBtn" type="button" aria-label="打印或导出 PDF">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 9V3h12v6"/><path d="M6 18H4a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-2"/><path d="M8 14h8v7H8z"/>
        </svg>
      </button>
    </div>
  </div>

  <nav class="nav-chips" id="navChips" aria-label="快捷导航">
    <a href="#highlights">亮点成果</a>
    <a href="#experience">经历</a>
    <a href="#projects">项目</a>
    <a href="#skills">技能</a>
    <a href="#education">教育证书</a>
    <a href="#gallery">个人风采</a>
  </nav>
</header>

<main class="wrap" id="main">

  <section id="hero" class="hero" aria-label="个人摘要"></section>

  <section id="highlights" class="block reveal">
    <div class="sec-head"><span class="sec-idx">01</span><h2>亮点成果</h2><span class="line"></span></div>
    <div class="hl-grid" id="hlGrid"></div>
  </section>

  <section id="experience" class="block reveal">
    <div class="sec-head"><span class="sec-idx">02</span><h2>经历</h2><span class="line"></span></div>
    <div class="tabs" role="tablist" aria-label="经历分类" id="expTabs"></div>
    <div id="expPanels"></div>
  </section>

  <section id="projects" class="block reveal">
    <div class="sec-head"><span class="sec-idx">03</span><h2>项目经历</h2><span class="line"></span></div>

    if (!canvas || !canvas.getContext) return;
    var ctx = canvas.getContext('2d', { alpha: true });
    if (!ctx) return;

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = 0, H = 0;
    var particles = [];
    var pointer = { x: -9999, y: -9999, active: false };
    var rafId = null;
    var running = true;

    function getColors() {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      return dark
        ? ['#f48fb1', '#ffe082', '#ce93d8', '#a1887f', '#80cbc4']
        : ['#f06292', '#ffd54f', '#ab47bc', '#795548', '#4db6ac'];
    }

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      var density = W < 640 ? 14000 : 18000;
      var count = Math.max(12, Math.min(44, Math.round((W * H) / density)));
      spawn(count);
    }

    function spawn(count) {
      var colors = getColors();
      particles = [];
      for (var i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() * 3.2 + 1.6,
          vx: (Math.random() - 0.5) * 0.28,
          vy: (Math.random() - 0.5) * 0.28,
          c: colors[(Math.random() * colors.length) | 0],
          a: Math.random() * 0.4 + 0.35,
          phase: Math.random() * Math.PI * 2,
          speed: Math.random() * 0.015 + 0.008
        });
      }
    }

    function draw() {
      if (!running) return;
      ctx.clearRect(0, 0, W, H);

      var i, j, p, q, dx, dy, dist, alpha;

      for (i = 0; i < particles.length; i++) {
        p = particles[i];

        if (pointer.active) {
          dx = pointer.x - p.x;
          dy = pointer.y - p.y;
          dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 130 && dist > 0.1) {
            var force = (130 - dist) / 130 * 0.35;
            p.vx += (dx / dist) * force * 0.12;
            p.vy += (dy / dist) * force * 0.12;
          }
        }

        p.x += p.vx;
        p.y += p.vy;
        p.phase += p.speed;

        p.vx *= 0.985;
        p.vy *= 0.985;

        if (p.x < -10) { p.x = -10; p.vx *= -1; }
        else if (p.x > W + 10) { p.x = W + 10; p.vx *= -1; }
        if (p.y < -10) { p.y = -10; p.vy *= -1; }
        else if (p.y > H + 10) { p.y = H + 10; p.vy *= -1; }

        var wobble = Math.sin(p.phase) * 0.8;
        var rr = p.r + wobble * 0.5;
        if (rr < 0.6) rr = 0.6;

        ctx.beginPath();
        ctx.globalAlpha = p.a * (0.75 + Math.sin(p.phase) * 0.25);
        ctx.fillStyle = p.c;
        ctx.arc(p.x, p.y, rr, 0, Math.PI * 2);
        ctx.fill();

        for (j = i + 1; j < particles.length; j++) {
          q = particles[j];
          dx = p.x - q.x;
          dy = p.y - q.y;
          var d2 = dx * dx + dy * dy;
          if (d2 < 8100) {
            alpha = (1 - Math.sqrt(d2) / 90) * 0.16;
            ctx.beginPath();
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = p.c;
            ctx.lineWidth = 0.7;
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(q.x, q.y);
            ctx.stroke();
          }
        }
      }

      ctx.globalAlpha = 1;
      rafId = requestAnimationFrame(draw);
    }

    function start() {
      if (rafId !== null) return;
      running = true;
      rafId = requestAnimationFrame(draw);
    }

    function stop() {
      running = false;
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    }

    var resizeTimer = null;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resize, 180);
    }, { passive: true });

    window.addEventListener('pointermove', function (e) {
      pointer.x = e.clientX;
      pointer.y = e.clientY;
      pointer.active = true;
    }, { passive: true });

    window.addEventListener('pointerleave', function () {
      pointer.active = false;
      pointer.x = pointer.y = -9999;
    }, { passive: true });

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) stop();
      else { resize(); start(); }
    });

    var themeObserver = new MutationObserver(function (mutations) {
      mutations.forEach(function (m) {
        if (m.attributeName === 'data-theme') {
          var colors = getColors();
          particles.forEach(function (p, idx) {
            p.c = colors[idx % colors.length];
          });
        }
      });
    });
    themeObserver.observe(document.documentElement, { attributes: true });

    resize();
    start();
  }

  /* ==========================================================
     4.1 数字滚动
     ========================================================== */
  function animateCount(el, target, suffix, duration) {
    if (reduceMotion) { el.textContent = target + suffix; return; }
    var start = null;
    duration = duration || 1200;
    function step(ts) {
      if (start === null) start = ts;
      var p = Math.min((ts - start) / duration, 1);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(target * eased) + suffix;
      if (p < 1) requestAnimationFrame(step);
      else el.textContent = target + suffix;
    }
    requestAnimationFrame(step);
  }

  function initCountUp() {
    var stats = $$('#heroStats .num');
    if (!stats.length) return;
    if (!('IntersectionObserver' in window) || reduceMotion) {
      stats.forEach(function (el) {
        var t = parseInt(el.getAttribute('data-target'), 10) || 0;
        var s = el.getAttribute('data-suffix') || '';
        el.textContent = t + s;
      });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        var el = entry.target;
        var t = parseInt(el.getAttribute('data-target'), 10) || 0;
        var s = el.getAttribute('data-suffix') || '';
        animateCount(el, t, s, 1200);
        io.unobserve(el);
      });
    }, { threshold: 0.5 });
    stats.forEach(function (el) { io.observe(el); });
  }

  function renderExperience() {
    var groups = resume.experience || [];

    if (!groups.length) { $('#experience').style.display = 'none'; return; }

    var tabFrag = document.createDocumentFragment();
    groups.forEach(function (g, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tab';
      b.id = 'tab-' + g.id;
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-controls', 'panel-' + g.id);
      b.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
      b.tabIndex = i === 0 ? 0 : -1;
      b.textContent = g.label;
      tabFrag.appendChild(b);
    });
    tabsEl.appendChild(tabFrag);

    var panelFrag = document.createDocumentFragment();
    groups.forEach(function (g, i) {
      var p = document.createElement('div');
      p.className = 'tab-panel' + (i === 0 ? '' : ' is-hidden');
      p.id = 'panel-' + g.id;
      p.setAttribute('role', 'tabpanel');
      p.setAttribute('aria-labelledby', 'tab-' + g.id);
      p.setAttribute('data-label', g.label);
      p.tabIndex = 0;
      panelFrag.appendChild(p);
    });
    panelsEl.appendChild(panelFrag);

    var tabs = $$('[role="tab"]', tabsEl);
    var panels = $$('.tab-panel', panelsEl);
    var rendered = {};

    function paint(index) {
      var g = groups[index];
      if (rendered[g.id]) return;
      rendered[g.id] = true;
      panels[index].innerHTML = (g.items || []).map(expCardHTML).join('');
    }

    function select(index, focus) {
      tabs.forEach(function (t, i) {
        var on = i === index;
        t.setAttribute('aria-selected', on ? 'true' : 'false');
        t.tabIndex = on ? 0 : -1;
        if (on && focus) t.focus();
      });
      panels.forEach(function (p, i) {
        p.classList.toggle('is-hidden', i !== index);
      });
      paint(index);
    }

    tabsEl.addEventListener('click', function (e) {
      var t = e.target.closest('[role="tab"]');
      if (!t) return;
      var i = tabs.indexOf(t);
      if (i >= 0) select(i, false);
    });

    tabsEl.addEventListener('keydown', function (e) {
      var idx = tabs.indexOf(document.activeElement);
      if (idx < 0) return;
      var next = -1;
      if (e.key === 'ArrowRight') next = (idx + 1) % tabs.length;
      else if (e.key === 'ArrowLeft') next = (idx - 1 + tabs.length) % tabs.length;
      else if (e.key === 'Home') next = 0;
      else if (e.key === 'End') next = tabs.length - 1;
      if (next >= 0) { e.preventDefault(); select(next, true); }
    });

    paint(0);
  }

  /* ==========================================================
     11. 🔍 Lightbox 图片预览
     ========================================================== */
  function initLightbox() {
    var lb = $('#lightbox');
    var img = $('#lightboxImg');
    var cap = $('#lightboxCap');
    var closeBtn = $('#lightboxClose');
    if (!lb || !img) return;

    /* 避免重复绑定 */
    if (lb._bound) return;
    lb._bound = true;

    var lastFocus = null;

    function open(src, caption) {
      lastFocus = document.activeElement;
      img.src = src;
      img.alt = caption || '图片预览';
      cap.textContent = caption || '';
      lb.classList.add('show');
      document.body.style.overflow = 'hidden';
      /* 焦点移到关闭按钮 */
      setTimeout(function () { closeBtn.focus(); }, 60);
    }

    function close() {
      lb.classList.remove('show');
      document.body.style.overflow = '';
      /* 清空以免下次闪旧图 */
      setTimeout(function () {
        if (!lb.classList.contains('show')) {
          img.removeAttribute('src');
        }
      }, 260);
      if (lastFocus && lastFocus.focus) {
        try { lastFocus.focus(); } catch (e) {}
      }
    }

    document.addEventListener('click', function (e) {
      var trigger = e.target.closest('[data-lightbox]');
      if (trigger) {
        e.preventDefault();
        open(trigger.getAttribute('data-lightbox'), trigger.getAttribute('data-cap'));
      }
    });

    closeBtn.addEventListener('click', close);

    lb.addEventListener('click', function (e) {
      if (e.target === lb) close();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && lb.classList.contains('show')) close();
    });
  }

  /* ==========================================================
     12. 主题切换
     ========================================================== */
  var ICON_SUN =
    '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4M2 12h2M20 12h2"/>';
  var ICON_MOON = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    var icon = $('#themeIcon');
    if (icon) icon.innerHTML = theme === 'dark' ? ICON_SUN : ICON_MOON;
    var btn = $('#themeBtn');
    if (btn) btn.setAttribute('aria-label', theme === 'dark' ? '切换到浅色模式' : '切换到深色模式');
    var meta = $('#metaTheme');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#1a1513' : '#e8f5e9');
    try { localStorage.setItem('r-theme', theme); } catch (err) {}
  }

  function initTheme() {
    var current = document.documentElement.getAttribute('data-theme') || 'light';
    applyTheme(current);
    $('#themeBtn').addEventListener('click', function (e) {
      applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
      if (!reduceMotion && e.currentTarget.animate) {
        e.currentTarget.animate(
          [{ transform: 'rotate(0deg) scale(1)' }, { transform: 'rotate(360deg) scale(1.1)' }, { transform: 'rotate(360deg) scale(1)' }],
          { duration: 450, easing: 'ease-in-out' }
        );
      }
    });
  }

  /* ==========================================================
     13. 复制邮箱
     ========================================================== */
  function initCopyEmail() {
    var btn = $('#copyEmail');
    if (!btn) return;
    var label = btn.querySelector('span');
    var original = label.textContent;

    btn.addEventListener('click', function () {
      var email = getEmail();
      var done = function (ok) {
        btn.classList.add('ok');
        label.textContent = ok ? '已复制 ✓' : email;
        if (!reduceMotion && btn.animate) {
          btn.animate(
            [{ transform: 'scale(1)' }, { transform: 'scale(1.1)' }, { transform: 'scale(1)' }],
            { duration: 320, easing: 'cubic-bezier(.34,1.56,.64,1)' }
          );
        }
        clearTimeout(btn._t);
        btn._t = setTimeout(function () {
          label.textContent = original;
          btn.classList.remove('ok');
        }, 1700);
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(email).then(function () { done(true); }, function () { legacyCopy(email, done); });
      } else {
        legacyCopy(email, done);
      }
    });
  }

  function legacyCopy(text, cb) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    cb(ok);
  }

  /* ==========================================================
     14. 打印 / 返回顶部 / 导航高亮 / 进场动画
     ========================================================== */
  function initPrint() {
    var doPrint = function () { window.print(); };
    $('#printBtn').addEventListener('click', doPrint);
    document.addEventListener('click', function (e) {
      if (e.target.closest('[data-print]')) doPrint();
    });
  }

  function initToTop() {
    var btn = $('#toTop');
    var ticking = false;
    function onScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () {
        btn.classList.toggle('show', window.scrollY > 400);
        ticking = false;
      });
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    btn.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
    });
  }

  function initNavHighlight() {
    var links = $$('#navLinks a, #navChips a');
    if (!links.length || !('IntersectionObserver' in window)) return;

    var sections = [];
    links.forEach(function (a) {
      var el = document.querySelector(a.getAttribute('href'));
      if (el && sections.indexOf(el) === -1) sections.push(el);
    });
    if (!sections.length) return;

    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        var id = entry.target.id;
        links.forEach(function (a) {
          a.classList.toggle('active', a.getAttribute('href') === '#' + id);
        });
      });
    }, { rootMargin: '-70px 0px -60% 0px', threshold: 0 });

    sections.forEach(function (s) { io.observe(s); });
  }

  function initReveal() {
    var items = $$('.reveal');
    if (!('IntersectionObserver' in window) || reduceMotion) {
      items.forEach(function (el) { el.classList.add('in'); });
      animateBars();
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('in');
          io.unobserve(entry.target);
        }
      });
    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.05 });
    items.forEach(function (el) { io.observe(el); });

    var skillSection = $('#skills');
    if (skillSection) {
      var io2 = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) { animateBars(); io2.disconnect(); }
        });
      }, { threshold: 0.1 });
      io2.observe(skillSection);
    }
  }

  function initDock() {
    var mail = $('#dockMail');
    if (mail) mail.setAttribute('href', 'mailto:' + getEmail());
  }

  function initFooter() {
    var now = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    $('#year').textContent = now.getFullYear();
    $('#updated').textContent = now.getFullYear() + '-' + p(now.getMonth() + 1) + '-' + p(now.getDate());
  }

  /* ==========================================================
     15. 启动
     ========================================================== */
  function init() {
    renderHero();
    renderHighlights();
    renderExperience();
    renderProjects();
    renderSkills();
    renderEducation();
    renderGallery();

    initTheme();
    initCopyEmail();
    initPrint();
    initToTop();
    initNavHighlight();
    initReveal();
    initCountUp();
    initDock();
    initFooter();
    initParticles();

    window.addEventListener('beforeprint', function () {
      animateBars();
      $$('.tab-panel').forEach(function (p) { p.classList.remove('is-hidden'); });
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init, { once: true });
  } else {
    init();
  }
})();
</script>
</body>
</html>
